[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2i-exp3"
version = "0.1.2"
description = "Feedback-conditioned operator search for query-bounded text-to-image evaluation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "build>=1"]
sd35 = ["torch>=2.4", "torchvision>=0.19", "diffusers>=0.35.1,<0.36", "transformers>=4.56,<5", "accelerate>=1.10", "safetensors>=0.5", "sentencepiece>=0.2", "protobuf>=5", "Pillow>=10", "numpy>=1.26,<3", "onnxruntime>=1.17", "opencv-python-headless>=4.9", "huggingface_hub>=0.34,<1"]
llm = ["torch>=2.4", "transformers>=4.56,<5", "accelerate>=1.10", "fastapi>=0.110", "uvicorn>=0.29", "einops>=0.8", "timm>=1.0", "Pillow>=10"]

[project.scripts]
t2i-exp3 = "t2i_exp3.cli:main"
t2i-exp3-data = "t2i_exp3.resources:main"
t2i-exp3-config = "t2i_exp3.configure:main"
t2i-exp3-summary = "t2i_exp3.summary:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
